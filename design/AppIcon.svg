<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: 824×824 body on a 1024 canvas, like the extension icon (icons/icon128.png) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b45"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb6ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- shackle -->
  <path d="M372 470 V385 a140 140 0 0 1 280 0 V470" fill="none" stroke="url(#lock)" stroke-width="62" stroke-linecap="round"/>
  <!-- body -->
  <rect x="300" y="450" width="424" height="330" rx="56" fill="url(#lock)"/>
  <!-- keyhole -->
  <circle cx="512" cy="588" r="42" fill="#13203a"/>
  <path d="M492 610 h40 l12 92 a10 10 0 0 1 -10 11 h-44 a10 10 0 0 1 -10 -11 z" fill="#13203a"/>
</svg>
